spring:
  datasource:
    url: jdbc:h2:mem:identityreference;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/h2

identity-reference:
  persistence:
    h2:
      enabled: true
    oracle:
      enabled: false
  cache:
    redis:
      enabled: false
  provider:
    real-integrations-enabled: false
    adapters:
      - type: mock-national-agency
        provider-id: mock-national-agency
        display-name: Mock National Agency
        enabled: true
