<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Identity Reference Console</title>
  <link rel="stylesheet" href="/admin-console/console.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="rail-top">
        <div class="logo">IR</div><div class="wordmark"><b>Identity Reference</b><span>Admin console</span></div>
      </div>
      <div class="workspace"><span class="pulse"></span><div><b>Production</b><small>Connected workspace</small></div><span class="chevron">⌄</span></div>
      <nav id="navigation" aria-label="Console navigation"></nav>
      <div class="rail-bottom"><button class="rail-link" data-domain="settings">⚙ <span>Settings</span></button><div class="account"><span class="avatar">AD</span><div><b>Administrator</b><small>System operator</small></div><span>•••</span></div></div>
    </aside>
    <main class="main">
      <header class="header"><div><div class="breadcrumbs">CONTROL PLANE <span>/</span> <b id="crumb">OVERVIEW</b></div><h1 id="pageTitle">Overview</h1><p id="pageDescription">A live view of your identity reference service.</p></div><div class="header-actions"><button class="quiet" id="refreshButton">↻ <span>Refresh</span></button><button class="primary" id="quickAction">＋ New action</button></div></header>
      <div id="notice" class="notice hidden"></div>
      <div id="app"></div>
    </main>
  </div>
  <script src="/admin-console/console.js"></script>
</body>
</html>
