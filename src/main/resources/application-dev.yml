spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${IDENTITY_H2_URL:jdbc:h2:file:${IDENTITY_H2_PATH:./data/identity-reference};DB_CLOSE_ON_EXIT=FALSE}
    username: ${IDENTITY_H2_USERNAME:sa}
    password: ${IDENTITY_H2_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
  data:
    redis:
      host: ${IDENTITY_REDIS_HOST:172.16.88.115}
      port: ${IDENTITY_REDIS_PORT:6379}
      password: ${IDENTITY_REDIS_PASSWORD:StrongRedisPassword}
      database: ${IDENTITY_REDIS_DATABASE:3}
      timeout: ${IDENTITY_REDIS_TIMEOUT:2s}
      connect-timeout: ${IDENTITY_REDIS_CONNECT_TIMEOUT:2s}
      repositories:
        enabled: false
logging:
  config: classpath:log4j2-spring.xml
identity-reference:
  persistence:
    h2:
      enabled: true
    oracle:
      enabled: false
  cache:
    redis:
      enabled: ${IDENTITY_REDIS_ENABLED:false}
      key-prefix: "${IDENTITY_REDIS_KEY_PREFIX:identity-ref:v1:}"
      entry-ttl: ${IDENTITY_REDIS_ENTRY_TTL:24h}

  admin-console:
    enabled: true
    development-mode: true
    authentication:
      enabled: false
      login-page-enabled: false
    sections:
      test-data: true
      api-testing: true