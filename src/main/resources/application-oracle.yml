spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${IDENTITY_ORACLE_URL:jdbc:oracle:thin:@//172.16.88.115:1521:XE}
    username: ${IDENTITY_ORACLE_USERNAME:oracle}
    password: ${IDENTITY_ORACLE_PASSWORD:oracle}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
