spring:
  application:
    name: identity-reference-service
  profiles:
    default: local
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
identity-reference:
  provider:
    real-integrations-enabled: false
    adapters:
      - type: mock-national-agency
        provider-id: mock-national-agency
        display-name: Mock National Agency
        enabled: true
  persistence:
    oracle:
      enabled: false
  cache:
    l1:
      enabled: true
      maximum-size: 10000
    redis:
      enabled: false
      key-prefix: "identity-ref:v1:"
  refresh:
    scheduler-enabled: true
    scheduler-delay: 10s
    batch-size: 1000
    lease-duration: 30s
    zone: UTC
    stale-while-refresh: true
    refresh-executor-core-pool-size: 4
    refresh-executor-max-pool-size: 16
    refresh-executor-queue-capacity: 1000
    refresh-executor-thread-name-prefix: identity-refresh-
    providers:
      mock-national-agency:
        version: 1
        ttl: 24h
        stale-grace: 12h
        refresh-before-expiry: 6h
        max-requests-per-second: 100
        max-concurrent-requests: 16
        max-attempts: 2
        initial-backoff: 1s
        max-backoff: 4s
        timeout: 5s
        refresh-window-start: "00:00"
        refresh-window-end: "06:00"
  biometric:
    embedding-enabled: false
  operational:
    request-logging-enabled: ${IDENTITY_REQUEST_LOGGING_ENABLED:true}
  api:
    security:
      enabled: false
      lookup-username: ${IDENTITY_API_LOOKUP_USERNAME:}
      lookup-password: ${IDENTITY_API_LOOKUP_PASSWORD:}
      admin-username: ${IDENTITY_API_ADMIN_USERNAME:}
      admin-password: ${IDENTITY_API_ADMIN_PASSWORD:}
    rate-limit:
      enabled: true
      requests-per-minute: ${IDENTITY_API_RATE_LIMIT_PER_MINUTE:60}