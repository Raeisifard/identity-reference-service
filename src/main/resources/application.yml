spring:
  application:
    name: identity-reference-service
  profiles:
    default: local
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
identity-reference:
  provider:
    real-integrations-enabled: false
    adapters:
      - type: mock-national-agency
        provider-id: mock-national-agency
        display-name: Mock National Agency
        enabled: true
  persistence:
    oracle:
      enabled: false
  cache:
    l1:
      enabled: true
      maximum-size: 10000
    redis:
      enabled: false
      key-prefix: "identity-ref:v1:"
  biometric:
    embedding-enabled: false
